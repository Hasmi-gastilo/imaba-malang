<main class="main">
  <div class="topbar">
    <h1>Kelola Program</h1>
    <div class="user-info">
      <span id="adminUserName">Admin</span>
      <div class="user-avatar">A</div>
    </div>
  </div>

  <div class="content">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Daftar Program Kerja</span>
        <button class="btn btn-primary" onclick="openCreateModal()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Tambah Program
        </button>
      </div>

      <div class="filters">
        <input type="text" id="searchInput" placeholder="Cari nama program..." oninput="filterTable()">
        <select id="statusFilter" onchange="filterTable()">
          <option value="">Semua Status</option>
          <option value="Direncanakan">Direncanakan</option>
          <option value="Berjalan">Berjalan</option>
          <option value="Selesai">Selesai</option>
          <option value="Dibatalkan">Dibatalkan</option>
        </select>
      </div>

      <div class="table-wrapper">
        <table id="dataTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Nama Program</th>
              <th>PIC</th>
              <th>Tanggal</th>
              <th>Status</th>
              <th>Progress</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="dataTableBody">
            <tr class="loading-row"><td colspan="7">Memuat data program...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="dataModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Tambah Program Baru</h2>
      <button class="modal-close" onclick="hideModal('dataModal')">&times;</button>
    </div>
    <form id="dataForm" onsubmit="handleSubmit(event)">
      <input type="hidden" id="dataId">
      <div class="form-group">
        <label>Nama Program *</label>
        <input type="text" id="progName" required placeholder="Contoh: Pelatihan Kepemimpinan Dasar">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>PIC (Penanggung Jawab) *</label>
          <input type="text" id="progPic" required>
        </div>
        <div class="form-group">
          <label>Kontak PIC</label>
          <input type="text" id="progPicContact" placeholder="Nomor WA">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Tanggal Mulai *</label>
          <input type="date" id="progStartDate" required>
        </div>
        <div class="form-group">
          <label>Tanggal Selesai *</label>
          <input type="date" id="progEndDate" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Status</label>
          <select id="progStatus">
            <option value="Direncanakan">Direncanakan</option>
            <option value="Berjalan">Berjalan</option>
            <option value="Selesai">Selesai</option>
            <option value="Dibatalkan">Dibatalkan</option>
          </select>
        </div>
        <div class="form-group">
          <label>Progress (%)</label>
          <input type="number" id="progProgress" min="0" max="100" value="0">
        </div>
      </div>
      <div class="form-group">
        <label>Upload Gambar/Ilustrasi Program</label>
        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="file" id="progImageFile" accept="image/*" style="flex: 1;">
          <input type="hidden" id="progImage">
          <img id="progImagePreview" style="display:none; width:60px; height:60px; object-fit:cover; border-radius:4px; border:1px solid #ccc;">
        </div>
      </div>
      <div class="form-group">
        <label>Anggaran (Rp)</label>
        <input type="number" id="progBudget" value="0">
      </div>
      <div class="form-group">
        <label>Deskripsi *</label>
        <textarea id="progDesc" required placeholder="Jelaskan detail program..."></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="hideModal('dataModal')">Batal</button>
        <button type="submit" class="btn btn-primary" id="submitBtn">Simpan Program</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="../js/api.js?v=1787750187.86751"></script>
<script src="../js/admin-shared.js"></script>
<script>
function checkAuth() {
    if (typeof window.requireAdmin === "function") {
        window.requireAdmin();
    } else {
        setTimeout(checkAuth, 50);
    }
}
checkAuth();

  let allData = [];
  const API_URL = '/api/programs';

  document.addEventListener('DOMContentLoaded', loadData);

  async function loadData() {
    try {
      if (!window.api) {
        setTimeout(loadData, 50);
        return;
      }
      const res = await window.api.getAllPrograms();
      allData = res.data || [];
      renderTable(allData);
    } catch (err) {
      allData = getDemoData();
      renderTable(allData);
    }
  }

  function getDemoData() {
    return [
      { _id: '1', name: 'Pelatihan Kader Dasar', pic: 'Andi', startDate: new Date('2024-03-01'), endDate: new Date('2024-03-03'), status: 'Selesai', progress: 100 },
      { _id: '2', name: 'Desa Binaan', pic: 'Budi', startDate: new Date('2024-05-01'), endDate: new Date('2024-12-31'), status: 'Berjalan', progress: 45 },
    ];
  }

  function getStatusBadge(status) {
    if (status === 'Selesai') return 'badge-success';
    if (status === 'Berjalan') return 'badge-info';
    if (status === 'Dibatalkan') return 'badge-danger';
    return 'badge-warning'; // Direncanakan
  }

  function renderTable(data) {
    const tbody = document.getElementById('dataTableBody');
    if (!data.length) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><p>Belum ada program. Klik "Tambah Program" untuk memulai.</p></div></td></tr>';
      return;
    }
    tbody.innerHTML = data.map((d, i) => `
      <tr>
        <td>${i + 1}</td>
        <td><strong>${d.name}</strong></td>
        <td>${d.pic}</td>
        <td>${formatDate(d.startDate)} - ${formatDate(d.endDate)}</td>
        <td><span class="badge ${getStatusBadge(d.status)}">${d.status}</span></td>
        <td>
          <div class="progress-bar"><div class="progress-fill" style="width: ${d.progress || 0}%"></div></div>
          ${d.progress || 0}%
        </td>
        <td>
          <button class="btn btn-warning btn-sm" onclick="openEditModal('${d._id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteData('${d._id}', '${d.name}')">Hapus</button>
        </td>
      </tr>
    `).join('');
  }

  function filterTable() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    const filtered = allData.filter(d => {
      const matchSearch = d.name.toLowerCase().includes(search);
      const matchStatus = !status || d.status === status;
      return matchSearch && matchStatus;
    });
    renderTable(filtered);
  }

  function openCreateModal() {
    document.getElementById('modalTitle').textContent = 'Tambah Program Baru';
    document.getElementById('dataForm').reset();
    document.getElementById('dataId').value = '';
    document.getElementById('progImage').value = '';
    document.getElementById('progImagePreview').style.display = 'none';
    document.getElementById('submitBtn').textContent = 'Simpan Program';
    showModal('dataModal');
  }

  function openEditModal(id) {
    const d = allData.find(x => x._id == id);
    if (!d) return;
    document.getElementById('modalTitle').textContent = 'Edit Program';
    document.getElementById('dataId').value = d._id;
    document.getElementById('progName').value = d.name || '';
    document.getElementById('progStatus').value = d.status || 'Direncanakan';
    document.getElementById('progStartDate').value = toInputDate(d.startDate);
    document.getElementById('progEndDate').value = toInputDate(d.endDate);
    document.getElementById('progPic').value = d.pic || '';
    document.getElementById('progPicContact').value = d.picContact || '';
    document.getElementById('progProgress').value = d.progress || 0;
    document.getElementById('progBudget').value = d.budget || 0;
    document.getElementById('progDesc').value = d.description || '';
    document.getElementById('progImage').value = d.image || '';
    
    const preview = document.getElementById('progImagePreview');
    if (d.image) {
      preview.src = d.image;
      preview.style.display = 'block';
    } else {
      preview.style.display = 'none';
    }

    document.getElementById('submitBtn').textContent = 'Update Program';
    showModal('dataModal');
  }

  document.getElementById('progImageFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('progImagePreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
      }
      reader.readAsDataURL(file);
    }
  });

  async function handleSubmit(e) {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Menyimpan...';

    try {
      const fileInput = document.getElementById('progImageFile');
      let imageUrl = document.getElementById('progImage').value;
      
      if (fileInput.files.length > 0) {
        submitBtn.textContent = 'Mengupload Gambar...';
        imageUrl = await uploadImageToServer(fileInput.files[0]);
      }

      const id = document.getElementById('dataId').value;
      const payload = {
        name: document.getElementById('progName').value,
        status: document.getElementById('progStatus').value,
        startDate: document.getElementById('progStartDate').value,
        endDate: document.getElementById('progEndDate').value,
        pic: document.getElementById('progPic').value,
        picContact: document.getElementById('progPicContact').value,
        progress: parseInt(document.getElementById('progProgress').value) || 0,
        budget: parseInt(document.getElementById('progBudget').value) || 0,
        description: document.getElementById('progDesc').value,
        image: imageUrl
      };

      submitBtn.textContent = 'Menyimpan Data...';

      if (id) {
        await window.api.updateProgram(id, payload);
        showAdminToast('Program berhasil diperbarui!');
      } else {
        await window.api.createProgram(payload);
        showAdminToast('Program berhasil ditambahkan!');
      }
      hideModal('dataModal');
      loadData();
    } catch (err) {
      showAdminToast(err.message || 'Gagal menyimpan program', 'error');
    } finally {
      submitBtn.disabled = false;
      const id = document.getElementById('dataId').value;
      submitBtn.textContent = id ? 'Update Program' : 'Simpan Program';
    }
  }

  async function deleteData(id, title) {
    if (!confirmDelete(title)) return;
    try {
      await window.api.deleteProgram(id);
      showAdminToast('Program berhasil dihapus!');
      loadData();
    } catch (err) {
      showAdminToast(err.message || 'Gagal menghapus program', 'error');
    }
  }
</script>
</body>

<div class="main">
  <header class="topbar">
    <h1>Pengaturan Beranda</h1>
    <div class="user-info">
      <div class="user-avatar" id="topAvatar">A</div>
      <span id="topName">Admin</span>
    </div>
  </header>

  <div class="content">
    <div class="card" style="max-width: 800px;">
      <div class="card-header">
        <h2 class="card-title">Pengaturan Beranda (Homepage)</h2>
      </div>

      <form id="homepageForm" enctype="multipart/form-data">
        <div class="form-group">
          <label>Judul Utama (Hero Title)</label>
          <input type="text" id="heroTitle" name="heroTitle" required>
        </div>

        <div class="form-group">
          <label>Sub-judul Utama (Hero Subtitle)</label>
          <textarea id="heroSubtitle" name="heroSubtitle" rows="3" required></textarea>
        </div>

        <div class="form-group">
          <label>Gambar Latar Utama (Hero Image)</label>
          <input type="file" id="heroImageFile" accept="image/*" onchange="previewImg(this, 'heroPreview')">
          <img id="heroPreview" class="img-preview" alt="Preview Hero">
          <small>Kosongkan jika tidak ingin mengubah gambar.</small>
        </div>

        <div class="form-group">
          <label>Judul Seksi Tentang (About Title)</label>
          <input type="text" id="aboutTitle" name="aboutTitle" required>
        </div>

        <div class="form-group">
          <label>Teks Seksi Tentang (About Text)</label>
          <textarea id="aboutText" name="aboutText" rows="6" required></textarea>
        </div>

        <div class="form-group">
          <label>Gambar Seksi Tentang (About Image)</label>
          <input type="file" id="aboutImageFile" accept="image/*" onchange="previewImg(this, 'aboutPreview')">
          <img id="aboutPreview" class="img-preview" alt="Preview About">
          <small>Kosongkan jika tidak ingin mengubah gambar.</small>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="loadData()">Reset</button>
          <button type="submit" class="btn btn-primary save-btn" id="saveBtn">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script type="module" src="../js/api.js?v=1788631631"></script>
<script src="../js/admin-shared.js"></script>
<script>
  function checkAuth() {
    if (typeof window.requireAdmin === "function") {
        window.requireAdmin();
    } else {
        setTimeout(checkAuth, 50);
    }
}
checkAuth();

  function updateTopName() {
    if (typeof window.getCurrentUser !== "function") {
        setTimeout(updateTopName, 50);
        return;
    }
    const user = window.getCurrentUser();
    if (user) {
        const topName = document.getElementById('topName');
        if (topName) topName.textContent = user.email || user.username || 'Admin';
    }
}
updateTopName();

  // Preview image before upload
  function previewImg(input, previewId) {
    const preview = document.getElementById(previewId);
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(input.files[0]);
    } else {
      preview.style.display = 'none';
    }
  }

  // Load current data from server
  async function loadData() {
    if (!window.api) {
        setTimeout(loadData, 50);
        return;
    }
    try {
      const res = await api.getHomepageData();
      if (res.success && res.data) {
        const d = res.data;
        document.getElementById('heroTitle').value = d.heroTitle || '';
        document.getElementById('heroSubtitle').value = d.heroSubtitle || '';
        document.getElementById('aboutTitle').value = d.aboutTitle || '';
        document.getElementById('aboutText').value = d.aboutText || '';

        if (d.heroImage) {
          const heroPreview = document.getElementById('heroPreview');
          heroPreview.src = d.heroImage;
          heroPreview.style.display = 'block';
        }
        if (d.aboutImage) {
          const aboutPreview = document.getElementById('aboutPreview');
          aboutPreview.src = d.aboutImage;
          aboutPreview.style.display = 'block';
        }
      }
    } catch (e) {
      console.error('loadData error:', e);
      alert('Gagal memuat pengaturan beranda: ' + e.message);
    }
  }

  // Submit form
  document.getElementById('homepageForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.classList.add('loading');
    saveBtn.textContent = 'Menyimpan...';

    try {
      const payload = {
        heroTitle: document.getElementById('heroTitle').value,
        heroSubtitle: document.getElementById('heroSubtitle').value,
        aboutTitle: document.getElementById('aboutTitle').value,
        aboutText: document.getElementById('aboutText').value,
      };

      const heroFile = document.getElementById('heroImageFile').files[0];
      const aboutFile = document.getElementById('aboutImageFile').files[0];
      
      if (heroFile) {
        payload.heroImage = await uploadImageToServer(heroFile);
      }
      if (aboutFile) {
        payload.aboutImage = await uploadImageToServer(aboutFile);
      }

      const res = await api.updateHomepageData(payload);
      if (res.success) {
        alert('Berhasil menyimpan pengaturan beranda!');
        // Reset file inputs
        document.getElementById('heroImageFile').value = '';
        document.getElementById('aboutImageFile').value = '';
      } else {
        alert('Gagal: ' + res.message);
      }
    } catch (err) {
      console.error('submit error:', err);
      alert('Gagal menyimpan: ' + err.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.classList.remove('loading');
      saveBtn.textContent = 'Simpan Perubahan';
    }
  });

  // Load data on page ready
  loadData();
</script>

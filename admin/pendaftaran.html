<div class="main">
  <header class="topbar">
    <h1>Verifikasi Pendaftaran</h1>
    <div class="user-info">
      <div class="user-avatar" id="topAvatar">A</div>
      <span id="topName">Admin</span>
    </div>
  </header>

  <div class="content">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Daftar Pendaftar Anggota Baru</h2>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="loadApplications('PENDING')">Menunggu Persetujuan</button>
        <button class="tab" onclick="loadApplications('APPROVED')">Disetujui</button>
        <button class="tab" onclick="loadApplications('REJECTED')">Ditolak</button>
      </div>

      <div class="applications-list" id="appList">
        <div class="empty-state">Memuat data...</div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="../js/api.js?v=1788632054"></script>
<script src="../js/admin-shared.js"></script>
<script>
  function checkAuth() {
    if (typeof window.requireAdmin === "function") {
        window.requireAdmin();
    } else {
        setTimeout(checkAuth, 50);
    }
}
checkAuth();
  let currentStatus = 'PENDING';
  
  // Highlight active sidebar menu
  document.querySelectorAll('.sidebar-menu a').forEach(a => {
    if (a.href.includes('pendaftaran.html')) a.classList.add('active');
  });

  async function loadApplications(status = 'PENDING') {
    currentStatus = status;
    const container = document.getElementById('appList');
    
    // Update active tab visual
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event?.target?.classList.add('active');
    
    container.innerHTML = '<div class="empty-state">Memuat data...</div>';

    try {
      const res = await api.getAllApplications(status);
      if (res.success && res.data.length > 0) {
        container.innerHTML = '';
        res.data.forEach(app => {
          container.appendChild(createAppCard(app));
        });
      } else {
        container.innerHTML = `<div class="empty-state">Tidak ada pendaftaran dengan status ${status}</div>`;
      }
    } catch (e) {
      container.innerHTML = `<div class="empty-state" style="color:red">Gagal memuat: ${e.message}</div>`;
    }
  }

  function createAppCard(app) {
    const div = document.createElement('div');
    div.className = 'application-card';
    const statusClass = app.status === 'PENDING' ? 'badge-pending' : (app.status === 'APPROVED' ? 'badge-approved' : 'badge-rejected');
    
    let actions = '';
    if (app.status === 'PENDING') {
      actions = `
        <button class="btn btn-primary btn-sm" onclick="approveApp('${app._id}')">Terima</button>
        <button class="btn btn-danger btn-sm" onclick="rejectApp('${app._id}')">Tolak</button>
      `;
    }

    div.innerHTML = `
      <div class="application-info">
        <img src="${app.photo || '../assets/default-avatar.png'}" class="applicant-photo" alt="Photo" onerror="this.src=''">
        <div class="applicant-details">
          <h3>${app.fullName} <span class="badge ${statusClass}">${app.status}</span></h3>
          <p><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="vertical-align:-2px; margin-right:4px;"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg> ${app.email} &nbsp;|&nbsp; <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="vertical-align:-2px; margin-right:4px;"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg> ${app.whatsapp}</p>
          <p><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="vertical-align:-2px; margin-right:4px;"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg> ${app.university} - ${app.studyProgram} (${app.batch})</p>
        </div>
      </div>
      <div class="application-actions">
        ${actions}
      </div>
    `;
    return div;
  }

  async function approveApp(id) {
    if (!confirm('Yakin ingin menerima anggota ini?')) return;
    try {
      const res = await api.approveApplication(id);
      if (res.success) {
        alert('Anggota berhasil diterima!');
        loadApplications(currentStatus);
      }
    } catch (e) {
      alert('Gagal: ' + e.message);
    }
  }

  async function rejectApp(id) {
    const reason = prompt('Masukkan alasan penolakan:');
    if (!reason) return;
    try {
      const res = await api.rejectApplication(id, reason);
      if (res.success) {
        alert('Pendaftaran ditolak.');
        loadApplications(currentStatus);
      }
    } catch (e) {
      alert('Gagal: ' + e.message);
    }
  }

  loadApplications('PENDING');
</script>

<main class="main">
  <div class="topbar">
    <h1>Kelola Profil & Sejarah</h1>
    <div class="user-info">
      <span id="adminUserName">Admin</span>
      <div class="user-avatar">A</div>
    </div>
  </div>

  <div class="content">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Edit Konten Halaman</span>
      </div>
      
      <div id="editorContainer" style="margin-top: 20px;">
        <form id="pageForm" onsubmit="handleSubmit(event)">
          
          <div class="page-section">
            <h3 class="section-title">Halaman Tentang Kami (Profil)</h3>
            <div class="form-group">
              <label>Judul Halaman</label>
              <input type="text" id="profilTitle" required class="form-control" style="width: 100%; padding: 10px;" value="Tentang Kami">
            </div>
            <div class="form-group">
              <label>Isi Konten Profil</label>
              <div id="profilEditor" style="background: #fff; border-radius: 4px;"></div>
            </div>
            <div style="font-size: 0.85rem; color: var(--gray);" id="profilUpdated"></div>
          </div>

          <div class="page-section">
            <h3 class="section-title">Halaman Sejarah</h3>
            <div class="form-group">
              <label>Judul Halaman</label>
              <input type="text" id="sejarahTitle" required class="form-control" style="width: 100%; padding: 10px;" value="Sejarah">
            </div>
            <div class="form-group">
              <label>Isi Konten Sejarah</label>
              <div id="sejarahEditor" style="background: #fff; border-radius: 4px;"></div>
            </div>
            <div style="font-size: 0.85rem; color: var(--gray);" id="sejarahUpdated"></div>
          </div>

          <div class="form-actions" style="margin-top: 30px; text-align: right; border-top: 1px solid var(--light-gray); padding-top: 20px;">
            <button type="submit" class="btn btn-primary" id="submitBtn" style="padding: 12px 30px; font-size: 1.1rem;">Simpan Semua Perubahan</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

<script type="module" src="../js/api.js?v=1788796436"></script>
<script src="../js/admin-shared.js?v=2"></script>
<script>
(function checkAuth() {
  if (typeof window.requireAdmin === 'function') window.requireAdmin();
  else setTimeout(checkAuth, 50);
})();

let quillProfil, quillSejarah;

const toolbarOptions = [
    [{ 'header': [1, 2, 3, false] }],
    ['bold', 'italic', 'underline', 'strike'],
    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
    ['link', 'image'],
    ['clean']
];

document.addEventListener('DOMContentLoaded', () => {
    quillProfil = new Quill('#profilEditor', {
        theme: 'snow',
        placeholder: 'Ketik konten profil di sini...',
        modules: { toolbar: toolbarOptions }
    });

    quillSejarah = new Quill('#sejarahEditor', {
        theme: 'snow',
        placeholder: 'Ketik konten sejarah di sini...',
        modules: { toolbar: toolbarOptions }
    });

    loadPageData();
});

async function loadPageData() {
    if (!window.api) { setTimeout(loadPageData, 50); return; }
    
    try {
        // Load Profil
        const resProfil = await window.api.getPageBySlug('profil');
        if (resProfil.success && resProfil.data) {
            document.getElementById('profilTitle').value = resProfil.data.title || 'Tentang Kami';
            quillProfil.root.innerHTML = resProfil.data.content || '';
            if (resProfil.data.updated_at) document.getElementById('profilUpdated').textContent = 'Terakhir diupdate: ' + new Date(resProfil.data.updated_at).toLocaleString('id-ID');
        }

        // Load Sejarah
        const resSejarah = await window.api.getPageBySlug('sejarah');
        if (resSejarah.success && resSejarah.data) {
            document.getElementById('sejarahTitle').value = resSejarah.data.title || 'Sejarah';
            quillSejarah.root.innerHTML = resSejarah.data.content || '';
            if (resSejarah.data.updated_at) document.getElementById('sejarahUpdated').textContent = 'Terakhir diupdate: ' + new Date(resSejarah.data.updated_at).toLocaleString('id-ID');
        }
    } catch (err) {
        showAdminToast(err.message || 'Error loading data', 'error');
    }
}

async function handleSubmit(e) {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Menyimpan...';
    
    try {
        const payloadProfil = {
            title: document.getElementById('profilTitle').value,
            content: quillProfil.root.innerHTML
        };
        const payloadSejarah = {
            title: document.getElementById('sejarahTitle').value,
            content: quillSejarah.root.innerHTML
        };
        
        const resP = await window.api.updatePage('profil', payloadProfil);
        const resS = await window.api.updatePage('sejarah', payloadSejarah);
        
        if (resP.success && resS.success) {
            showAdminToast('Semua halaman berhasil disimpan!');
            loadPageData(); 
        } else {
            showAdminToast('Gagal menyimpan beberapa halaman', 'error');
        }
    } catch (err) {
        showAdminToast(err.message || 'Error', 'error');
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Simpan Semua Perubahan';
    }
}
</script>

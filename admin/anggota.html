<div class="main">
  <header class="topbar">
    <h1>Verifikasi Pendaftaran</h1>
    <div class="user-info">
      <div class="user-avatar" id="topAvatar">A</div>
      <span id="topName">Admin</span>
    </div>
  </header>

  <div class="content">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Manajemen Anggota IMABA</h2>
      </div>

      <div class="filters">
        <input type="text" id="searchAnggota" placeholder="Cari nama atau NIM..." oninput="debounceSearch()">
        <select id="filterStatus" onchange="loadMembers()">
          <option value="">Semua Status</option>
          <option value="ACTIVE">Aktif</option>
          <option value="ALUMNI">Alumni</option>
        </select>
      </div>

      <div class="table-wrapper">
        <table id="membersTable">
          <thead>
            <tr>
              <th>Nama</th>
              <th>NIM / Universitas</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="membersList">
            <tr><td colspan="4" style="text-align:center">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module" src="../js/api.js"></script>
<script src="../js/admin-shared.js"></script>
<script>
  requireAdmin();
  
  // Highlight active sidebar menu
  document.querySelectorAll('.sidebar-menu a').forEach(a => {
    if (a.href.includes('anggota.html')) a.classList.add('active');
  });

  let searchTimeout;
  let allMembers = [];
  function debounceSearch() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(loadMembers, 500);
  }

  async function loadMembers() {
    if (!window.api) {
        setTimeout(loadMembers, 50);
        return;
    }
    const search = document.getElementById('searchAnggota').value;
    const status = document.getElementById('filterStatus').value;
    const tbody = document.getElementById('membersList');
    
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center">Memuat data...</td></tr>';

    try {
      const res = await api.getAllMembers({ search, status });
      if (res.success && res.data.members.length > 0) {
        allMembers = res.data.members;
        tbody.innerHTML = '';
        allMembers.forEach(member => {
          const statusClass = member.status === 'ACTIVE' ? 'badge-success' : 'badge-secondary';
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>
              <div style="display:flex; align-items:center; gap:10px;">
                <div class="user-avatar" style="width:32px;height:32px;font-size:0.75rem; overflow:hidden;">
                  ${member.photo ? `<img src="${member.photo}" alt="${member.fullName}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : member.fullName.charAt(0)}
                </div>
                <div>
                  <strong>${member.fullName}</strong><br>
                  <small style="color:#888">${member.email}</small>
                </div>
              </div>
            </td>
            <td>
              ${member.nim || '-'}<br>
              <small style="color:#888">${member.university || '-'}</small>
            </td>
            <td><span class="badge ${statusClass}">${member.status}</span></td>
            <td>
              <button class="btn btn-primary btn-sm" onclick="showDetail('${member._id}')" style="margin-right: 5px;">Detail</button>
              <button class="btn btn-danger btn-sm" onclick="deleteMember('${member._id}')">Hapus</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } else {
        allMembers = [];
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center">Tidak ada data anggota ditemukan.</td></tr>';
      }
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red">Gagal memuat: ${e.message}</td></tr>`;
    }
  }

  async function deleteMember(id) {
    if (!confirm('Yakin ingin menghapus anggota ini secara permanen?')) return;
    try {
      const res = await api.deleteMember(id);
      if (res.success) {
        alert('Anggota berhasil dihapus');
        loadMembers();
      }
    } catch (e) {
      alert('Gagal menghapus: ' + e.message);
    }
  }

  function showDetail(id) {
    const member = allMembers.find(m => m._id === id);
    if (!member) return;

    Swal.fire({
      title: 'Detail Anggota',
      html: `
        <div style="text-align: left; font-size: 0.95rem; line-height: 1.6;">
          ${member.photo ? `<div style="text-align:center; margin-bottom: 15px;"><img src="${member.photo}" alt="Foto" style="width:100px; height:100px; border-radius:50%; object-fit:cover;"></div>` : ''}
          <table style="width: 100%; border-collapse: collapse;">
            <tr><td style="padding: 5px 0; border-bottom: 1px solid #eee; width: 40%;"><strong>Nama Lengkap</strong></td><td style="padding: 5px 0; border-bottom: 1px solid #eee;">${member.fullName}</td></tr>
            <tr><td style="padding: 5px 0; border-bottom: 1px solid #eee;"><strong>Email</strong></td><td style="padding: 5px 0; border-bottom: 1px solid #eee;">${member.email}</td></tr>
            <tr><td style="padding: 5px 0; border-bottom: 1px solid #eee;"><strong>WhatsApp</strong></td><td style="padding: 5px 0; border-bottom: 1px solid #eee;">${member.whatsapp || '-'}</td></tr>
            <tr><td style="padding: 5px 0; border-bottom: 1px solid #eee;"><strong>Universitas</strong></td><td style="padding: 5px 0; border-bottom: 1px solid #eee;">${member.university || '-'}</td></tr>
            <tr><td style="padding: 5px 0; border-bottom: 1px solid #eee;"><strong>Fakultas</strong></td><td style="padding: 5px 0; border-bottom: 1px solid #eee;">${member.faculty || '-'}</td></tr>
            <tr><td style="padding: 5px 0; border-bottom: 1px solid #eee;"><strong>Prodi</strong></td><td style="padding: 5px 0; border-bottom: 1px solid #eee;">${member.studyProgram || '-'}</td></tr>
            <tr><td style="padding: 5px 0; border-bottom: 1px solid #eee;"><strong>NIM</strong></td><td style="padding: 5px 0; border-bottom: 1px solid #eee;">${member.nim || '-'}</td></tr>
            <tr><td style="padding: 5px 0; border-bottom: 1px solid #eee;"><strong>Angkatan</strong></td><td style="padding: 5px 0; border-bottom: 1px solid #eee;">${member.batch || '-'}</td></tr>
            <tr><td style="padding: 5px 0; border-bottom: 1px solid #eee;"><strong>Asal</strong></td><td style="padding: 5px 0; border-bottom: 1px solid #eee;">${member.origin || '-'}</td></tr>
            <tr><td style="padding: 5px 0; border-bottom: 1px solid #eee;"><strong>Alamat Malang</strong></td><td style="padding: 5px 0; border-bottom: 1px solid #eee;">${member.address || '-'}</td></tr>
            <tr><td style="padding: 5px 0; border-bottom: 1px solid #eee;"><strong>TTL</strong></td><td style="padding: 5px 0; border-bottom: 1px solid #eee;">${member.birthPlace || '-'}, ${member.birthDate || '-'}</td></tr>
          </table>
        </div>
      `,
      confirmButtonColor: 'var(--primary)',
      confirmButtonText: 'Tutup',
      width: '500px'
    });
  }

  loadMembers();
</script>

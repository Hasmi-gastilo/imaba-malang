<main class="main">
  <div class="topbar">
    <h1>Kelola Agenda</h1>
    <div class="user-info">
      <span id="adminUserName">Admin</span>
      <div class="user-avatar">A</div>
    </div>
  </div>

  <div class="content">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Daftar Agenda Kegiatan</span>
        <button class="btn btn-primary" onclick="openCreateModal()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Tambah Agenda
        </button>
      </div>

      <div class="filters">
        <input type="text" id="searchInput" placeholder="Cari nama agenda..." oninput="filterTable()">
        <select id="categoryFilter" onchange="filterTable()">
          <option value="">Semua Kategori</option>
          <option value="Kajian">Kajian</option>
          <option value="Kaderisasi">Kaderisasi</option>
          <option value="Bakti Sosial">Bakti Sosial</option>
          <option value="Olahraga">Olahraga</option>
          <option value="Rapat">Rapat</option>
          <option value="Seminar">Seminar</option>
          <option value="Workshop">Workshop</option>
          <option value="Lainnya">Lainnya</option>
        </select>
        <select id="statusFilter" onchange="filterTable()">
          <option value="">Semua Status</option>
          <option value="Direncanakan">Direncanakan</option>
          <option value="Pendaftaran Dibuka">Pendaftaran Dibuka</option>
          <option value="Berlangsung">Berlangsung</option>
          <option value="Selesai">Selesai</option>
          <option value="Dibatalkan">Dibatalkan</option>
        </select>
      </div>

      <div class="table-wrapper">
        <table id="dataTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Nama Agenda</th>
              <th>Tanggal</th>
              <th>Lokasi</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="dataTableBody">
            <tr class="loading-row"><td colspan="6">Memuat data agenda...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="dataModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Tambah Agenda Baru</h2>
      <button class="modal-close" onclick="hideModal('dataModal')">&times;</button>
    </div>
    <form id="dataForm" onsubmit="handleSubmit(event)">
      <input type="hidden" id="dataId">
      <div class="form-group">
        <label>Judul/Nama Agenda *</label>
        <input type="text" id="eventTitle" required placeholder="Contoh: Rapat Koordinasi Wilayah">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Kategori *</label>
          <select id="eventCategory" required>
            <option value="Kajian">Kajian</option>
            <option value="Kaderisasi">Kaderisasi</option>
            <option value="Bakti Sosial">Bakti Sosial</option>
            <option value="Olahraga">Olahraga</option>
            <option value="Rapat">Rapat</option>
            <option value="Seminar">Seminar</option>
            <option value="Workshop">Workshop</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="eventStatus">
            <option value="Direncanakan">Direncanakan</option>
            <option value="Pendaftaran Dibuka">Pendaftaran Dibuka</option>
            <option value="Berlangsung">Berlangsung</option>
            <option value="Selesai">Selesai</option>
            <option value="Dibatalkan">Dibatalkan</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Tanggal *</label>
          <input type="date" id="eventDate" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Waktu Mulai *</label>
            <input type="time" id="eventStartTime" required>
          </div>
          <div class="form-group">
            <label>Waktu Selesai *</label>
            <input type="time" id="eventEndTime" required>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>Upload Poster/Gambar (Opsional)</label>
        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="file" id="eventPosterFile" accept="image/*" style="flex: 1;">
          <input type="hidden" id="eventPoster">
          <img id="eventPosterPreview" style="display:none; width:60px; height:60px; object-fit:cover; border-radius:4px; border:1px solid #ccc;">
        </div>
      </div>
      <div class="form-group">
        <label>Lokasi *</label>
        <input type="text" id="eventLocation" required placeholder="Contoh: Gedung Rektorat Lt. 3">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>PIC (Penanggung Jawab) *</label>
          <input type="text" id="eventPic" required>
        </div>
        <div class="form-group">
          <label>Kontak PIC</label>
          <input type="text" id="eventPicContact" placeholder="Nomor WA">
        </div>
      </div>
      <div class="form-group">
        <label>Deskripsi *</label>
        <textarea id="eventDesc" required placeholder="Jelaskan detail agenda..."></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="hideModal('dataModal')">Batal</button>
        <button type="submit" class="btn btn-primary" id="submitBtn">Simpan Agenda</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="../js/api.js?v=1788630548"></script>
<script src="../js/admin-shared.js"></script>
<script>
function checkAuth() {
    if (typeof window.requireAdmin === "function") {
        window.requireAdmin();
    } else {
        setTimeout(checkAuth, 50);
    }
}
checkAuth();

  let allData = [];
  const API_URL = '/api/events';

  document.addEventListener('DOMContentLoaded', loadData);

  async function loadData() {
    try {
      if (!window.api) {
        setTimeout(loadData, 50);
        return;
      }
      const res = await window.api.getAllEvents();
      allData = res.data.events || res.data || [];
      renderTable(allData);
    } catch (err) {
      allData = getDemoData();
      renderTable(allData);
    }
  }

  function getDemoData() {
    return [
      { _id: '1', title: 'Kajian Rutin', date: new Date(), startTime: '15:30', endTime: '17:00', location: 'Masjid Kampus', status: 'Direncanakan', category: 'Kajian', pic: 'Ahmad' },
      { _id: '2', title: 'Rapat Pleno', date: new Date(), startTime: '19:00', endTime: '21:00', location: 'Sekretariat IMABA', status: 'Selesai', category: 'Rapat', pic: 'Budi' },
    ];
  }

  function getStatusBadge(status) {
    if (status === 'Selesai') return 'badge-success';
    if (status === 'Berlangsung' || status === 'Pendaftaran Dibuka') return 'badge-info';
    if (status === 'Dibatalkan') return 'badge-danger';
    return 'badge-warning'; // Direncanakan
  }

  function renderTable(data) {
    const tbody = document.getElementById('dataTableBody');
    if (!data.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><p>Belum ada agenda. Klik "Tambah Agenda" untuk memulai.</p></div></td></tr>';
      return;
    }
    tbody.innerHTML = data.map((d, i) => `
      <tr>
        <td>${i + 1}</td>
        <td><strong>${d.title}</strong><br><small style="color:#888">${d.category}</small></td>
        <td>${formatDate(d.date)}<br><small style="color:#888">${d.startTime} - ${d.endTime}</small></td>
        <td>${d.location}</td>
        <td><span class="badge ${getStatusBadge(d.status)}">${d.status}</span></td>
        <td>
          <button class="btn btn-warning btn-sm" onclick="openEditModal('${d._id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteData('${d._id}', '${d.title}')">Hapus</button>
        </td>
      </tr>
    `).join('');
  }

  function filterTable() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const cat = document.getElementById('categoryFilter').value;
    const status = document.getElementById('statusFilter').value;
    const filtered = allData.filter(d => {
      const matchSearch = d.title.toLowerCase().includes(search);
      const matchCat = !cat || d.category === cat;
      const matchStatus = !status || d.status === status;
      return matchSearch && matchCat && matchStatus;
    });
    renderTable(filtered);
  }

  function openCreateModal() {
    document.getElementById('modalTitle').textContent = 'Tambah Agenda Baru';
    document.getElementById('dataForm').reset();
    document.getElementById('dataId').value = '';
    document.getElementById('eventPoster').value = '';
    document.getElementById('eventPosterPreview').style.display = 'none';
    document.getElementById('submitBtn').textContent = 'Simpan Agenda';
    showModal('dataModal');
  }

  function openEditModal(id) {
    const d = allData.find(x => x._id == id);
    if (!d) return;
    document.getElementById('modalTitle').textContent = 'Edit Agenda';
    document.getElementById('dataId').value = d._id;
    document.getElementById('eventTitle').value = d.title || '';
    document.getElementById('eventCategory').value = d.category || 'Lainnya';
    document.getElementById('eventStatus').value = d.status || 'Direncanakan';
    document.getElementById('eventDate').value = toInputDate(d.date);
    document.getElementById('eventStartTime').value = d.startTime || '';
    document.getElementById('eventEndTime').value = d.endTime || '';
    document.getElementById('eventLocation').value = d.location || '';
    document.getElementById('eventPic').value = d.pic || '';
    document.getElementById('eventPicContact').value = d.picContact || '';
    document.getElementById('eventDesc').value = d.description || '';
    document.getElementById('eventPoster').value = d.poster || '';
    
    const preview = document.getElementById('eventPosterPreview');
    if (d.poster) {
      preview.src = d.poster;
      preview.style.display = 'block';
    } else {
      preview.style.display = 'none';
    }

    document.getElementById('submitBtn').textContent = 'Update Agenda';
    showModal('dataModal');
  }

  document.getElementById('eventPosterFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('eventPosterPreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
      }
      reader.readAsDataURL(file);
    }
  });

  async function handleSubmit(e) {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Menyimpan...';

    try {
      const fileInput = document.getElementById('eventPosterFile');
      let posterUrl = document.getElementById('eventPoster').value;
      
      if (fileInput.files.length > 0) {
        submitBtn.textContent = 'Mengupload Gambar...';
        posterUrl = await uploadImageToServer(fileInput.files[0]);
      }

      const id = document.getElementById('dataId').value;
      const payload = {
        title: document.getElementById('eventTitle').value,
        category: document.getElementById('eventCategory').value,
        status: document.getElementById('eventStatus').value,
        date: document.getElementById('eventDate').value,
        startTime: document.getElementById('eventStartTime').value,
        endTime: document.getElementById('eventEndTime').value,
        location: document.getElementById('eventLocation').value,
        pic: document.getElementById('eventPic').value,
        picContact: document.getElementById('eventPicContact').value,
        description: document.getElementById('eventDesc').value,
        poster: posterUrl
      };

      submitBtn.textContent = 'Menyimpan Data...';

      if (id) {
        await window.api.updateEvent(id, payload);
        showAdminToast('Agenda berhasil diperbarui!');
      } else {
        await window.api.createEvent(payload);
        showAdminToast('Agenda berhasil ditambahkan!');
      }
      hideModal('dataModal');
      loadData();
    } catch (err) {
      showAdminToast(err.message || 'Gagal menyimpan agenda', 'error');
    } finally {
      submitBtn.disabled = false;
      const id = document.getElementById('dataId').value;
      submitBtn.textContent = id ? 'Update Agenda' : 'Simpan Agenda';
    }
  }

  async function deleteData(id, title) {
    if (!confirmDelete(title)) return;
    try {
      await window.api.deleteEvent(id);
      showAdminToast('Agenda berhasil dihapus!');
      loadData();
    } catch (err) {
      showAdminToast(err.message || 'Gagal menghapus agenda', 'error');
    }
  }
</script>
</body>

<main class="main">
  <div class="topbar">
    <h1>Kelola Kepengurusan</h1>
    <div class="user-info">
      <span id="adminUserName">Admin</span>
      <div class="user-avatar">A</div>
    </div>
  </div>

  <div class="content">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Daftar Pengurus IMABA Malang</span>
        <button class="btn btn-primary" onclick="openCreateModal()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Tambah Pengurus
        </button>
      </div>

      <div class="table-wrapper">
        <table id="dataTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Foto</th>
              <th>Nama</th>
              <th>Jabatan</th>
              <th>Departemen</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="dataTableBody">
            <tr class="loading-row"><td colspan="6">Memuat data pengurus...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- Modal Pengurus -->
<div class="modal-overlay" id="dataModal">
  <div class="modal" style="max-width:620px; max-height:90vh; overflow-y:auto;">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Tambah Pengurus</h2>
      <button class="modal-close" onclick="hideModal('dataModal')">&times;</button>
    </div>
    <form id="dataForm" onsubmit="handleSubmit(event)">
      <input type="hidden" id="dataId">

      <div class="form-group">
        <label>Nama Lengkap *</label>
        <input type="text" id="pengurusName" required placeholder="Masukkan nama lengkap">
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
        <div class="form-group">
          <label>Jabatan *</label>
          <input type="text" id="pengurusPosition" required placeholder="Contoh: Ketua Umum">
        </div>
        <div class="form-group">
          <label>Departemen / Divisi *</label>
          <select id="pengurusDept" required>
            <option value="">Pilih Departemen/Jabatan...</option>
            <option value="KETUA UMUM">KETUA UMUM</option>
            <option value="SEKRETARIS">SEKRETARIS</option>
            <option value="BENDAHARA">BENDAHARA</option>
            <option value="PPA">PPA (Pengembangan Potensi Anggota)</option>
            <option value="KP">KP (Kajian dan Pengembangan)</option>
            <option value="PP">PP (Pemberdayaan Perempuan)</option>
            <option value="BAKMIN">BAKMIN (Badan Administrasi)</option>
            <option value="KOMINFO">KOMINFO (Komunikasi dan Informasi)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Foto Profil (Maks 2MB)</label>
        <input type="file" id="pengurusPhoto" accept="image/*">
        <small id="photoPreviewText" style="display:block; margin-top:5px; color:var(--primary);"></small>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
        <div class="form-group">
          <label>Link Instagram (Opsional)</label>
          <input type="url" id="pengurusIg" placeholder="https://instagram.com/username">
        </div>
        <div class="form-group">
          <label>Link LinkedIn (Opsional)</label>
          <input type="url" id="pengurusLinkedin" placeholder="https://linkedin.com/in/username">
        </div>
      </div>

      <div class="form-group">
        <label>Urutan Tampil (Opsional)</label>
        <input type="number" id="pengurusOrder" min="1" placeholder="Contoh: 1 = tampil paling awal">
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="hideModal('dataModal')">Batal</button>
        <button type="submit" class="btn btn-primary" id="submitBtn">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="../js/api.js?v=1788796436"></script>
<script src="../js/admin-shared.js?v=1788715255"></script>
<script>
(function checkAuth() {
  if (typeof window.requireAdmin === 'function') window.requireAdmin();
  else setTimeout(checkAuth, 50);
})();

let allData = [];

document.addEventListener('DOMContentLoaded', loadData);

async function loadData() {
  if (!window.api) { setTimeout(loadData, 50); return; }
  try {
    const res = await window.api.getAllPengurus();
    allData = res.data || [];
    renderTable(allData);
  } catch (err) {
    allData = [];
    renderTable([]);
  }
}

function renderTable(data) {
  const tbody = document.getElementById('dataTableBody');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><p>Belum ada pengurus. Klik "Tambah Pengurus".</p></div></td></tr>';
    return;
  }
  data.sort((a, b) => (a.order_index || 999) - (b.order_index || 999));
  tbody.innerHTML = data.map((d, i) => {
    const avatar = d.photo_url || ('https://ui-avatars.com/api/?name=' + encodeURIComponent(d.name || 'User') + '&background=random');
    return `<tr>
      <td>${i + 1}</td>
      <td><img src="${avatar}" onerror="this.src='https://ui-avatars.com/api/?name=User&background=random'" style="width:40px;height:40px;border-radius:50%;object-fit:cover;"></td>
      <td><strong>${d.name || '-'}</strong></td>
      <td>${d.position || '-'}</td>
      <td>${d.department || '-'}</td>
      <td>
        <button class="btn btn-warning btn-sm" onclick="openEditModal('${d.id}')">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteData('${d.id}', '${(d.name||'').replace(/'/g,"\\'")}')">Hapus</button>
      </td>
    </tr>`;
  }).join('');
}

function openCreateModal() {
  document.getElementById('modalTitle').textContent = 'Tambah Pengurus';
  document.getElementById('dataForm').reset();
  document.getElementById('dataId').value = '';
  document.getElementById('photoPreviewText').textContent = '';
  document.getElementById('submitBtn').textContent = 'Simpan';
  showModal('dataModal');
}

function openEditModal(id) {
  const d = allData.find(x => x.id === id);
  if (!d) return;
  document.getElementById('modalTitle').textContent = 'Edit Pengurus';
  document.getElementById('dataId').value = d.id;
  document.getElementById('pengurusName').value = d.name || '';
  document.getElementById('pengurusPosition').value = d.position || '';

  // Add dept to dropdown if custom
  const sel = document.getElementById('pengurusDept');
  let found = false;
  for (let i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === d.department) { found = true; break; }
  }
  if (!found && d.department) {
    const opt = document.createElement('option');
    opt.value = d.department; opt.text = d.department;
    sel.appendChild(opt);
  }
  document.getElementById('pengurusDept').value = d.department || '';
  document.getElementById('pengurusIg').value = d.instagram || '';
  document.getElementById('pengurusLinkedin').value = d.linkedin || '';
  document.getElementById('pengurusOrder').value = d.order_index || '';
  document.getElementById('photoPreviewText').textContent = d.photo_url ? '(Foto sudah ada — kosongkan jika tidak ingin mengubah)' : '';
  document.getElementById('submitBtn').textContent = 'Update';
  showModal('dataModal');
}

async function handleSubmit(e) {
  e.preventDefault();
  const id = document.getElementById('dataId').value;
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Menyimpan...';

  try {
    const photoFile = document.getElementById('pengurusPhoto').files[0];
    let photo_url = null;

    if (photoFile) {
      const uploadRes = await window.api.uploadImage(photoFile, 'pengurus');
      if (!uploadRes.success) throw new Error('Gagal upload foto: ' + (uploadRes.error || ''));
      photo_url = uploadRes.url;
    }

    const payload = {
      name: document.getElementById('pengurusName').value,
      position: document.getElementById('pengurusPosition').value,
      department: document.getElementById('pengurusDept').value,
      instagram: document.getElementById('pengurusIg').value || null,
      linkedin: document.getElementById('pengurusLinkedin').value || null,
      order_index: parseInt(document.getElementById('pengurusOrder').value) || null,
    };
    if (photo_url) payload.photo_url = photo_url;

    if (id) {
      await window.api.updatePengurus(id, payload);
      showAdminToast('Pengurus berhasil diperbarui!');
    } else {
      await window.api.createPengurus(payload);
      showAdminToast('Pengurus berhasil ditambahkan!');
    }
    hideModal('dataModal');
    loadData();
  } catch (err) {
    showAdminToast(err.message || 'Gagal menyimpan', 'error');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = id ? 'Update' : 'Simpan';
  }
}

async function deleteData(id, name) {
  if (!(await confirmDelete(name))) return;
  try {
    await window.api.deletePengurus(id);
    showAdminToast('Pengurus berhasil dihapus!');
    loadData();
  } catch (err) {
    showAdminToast(err.message || 'Gagal menghapus', 'error');
  }
}
</script>
</body>
